name: sqlitemanager-dev

services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    volumes:
      - ..:/workspaces/SqliteManager:cached
      # Testcontainers support: reuse the host daemon (see docker-outside-of-docker feature).
      - /var/run/docker.sock:/var/run/docker-host.sock
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Passw0rd_local}
    depends_on:
      mssql:
        condition: service_healthy
    networks: [sqlm]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # Dev-only credential for a container that is not reachable outside this compose network.
      # The shipping app has no password auth at all (PLAN.md §8) - this exists solely so tests
      # can reach SQL Server from Linux, where Windows auth is unavailable.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dev_Passw0rd_local}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [sqlm]

volumes:
  mssql-data:

networks:
  sqlm:
